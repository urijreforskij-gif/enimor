<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Энимор · экран игрока</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first — персонаж сверху, лента «в сцене», затем лист; док снизу: стикер аспектов и миникарта. На широком экране: персонаж слева, сцена справа */
:root {
  color-scheme: dark;
  --bg: #0e131b; --panel: #151c27; --panel-2: #1b2431; --line: #29344a;
  --ink: #e7e2d3; --muted: #8f98a8; --gold: #ecd9a0; --blood: #ff5d4d;
  --note: #f1df9a; --note-ink: #2a2310; --water: #2b5884;
  --display: "Oranienbaum", "Times New Roman", serif;
  --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 12px 110px; max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
@media (min-width: 960px) { .wrap { padding-bottom: 32px; } }
input[type=text], input[type=number], textarea { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: inherit; padding: 8px 10px; width: 100%; min-width: 0; }
input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
textarea { resize: vertical; line-height: 1.45; }
button { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; font-style: italic; }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }

/* top */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-size: 22px; }
.status { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.status .night { color: #cdd6ff; }
.demo-btn { font-size: 12px; padding: 5px 10px; border-style: dashed; color: var(--gold); border-color: #6d6240; }

/* layout */
.cols { display: grid; gap: 14px; }
@media (max-width: 959px) { .side { order: -1; } }
@media (min-width: 960px) { .cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: start; } .side { position: sticky; top: 12px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }

/* hero */
.hero { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: start; }
.portrait { width: 92px; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--gold); display: grid; place-items: center; font-family: var(--display); font-size: 42px; color: #1a1408; padding: 0; border: 0; }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
input.nameinput { font-family: var(--display); font-size: 30px; line-height: 1.05; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0 0 4px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.facts label { display: grid; gap: 3px; }
.facts input { padding: 6px 8px; font-size: 14px; }
details.bio { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
details.bio summary { cursor: pointer; padding: 10px 12px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.bio summary::-webkit-details-marker { display: none; }
details.bio summary::after { content: "Раскрыть"; font-size: 12px; color: var(--muted); }
details.bio[open] summary::after { content: "Скрыть"; }
details.bio textarea { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; min-height: 120px; }

/* trackers */
.tracks { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: center; }
.boxes, .tokens { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.box { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; font-family: var(--mono); border-radius: 8px; }
.box.on { background: var(--blood); border-color: var(--blood); color: #1a0806; font-weight: 600; }
.tok { width: 32px; height: 32px; border-radius: 50%; padding: 0; border: 1px solid #a8915a; background: radial-gradient(circle at 35% 30%, #fff3c9 0 18%, var(--gold) 19% 62%, #a8915a 63%); }
.en { width: 32px; height: 32px; border-radius: 50%; padding: 0; background: rgba(127,166,236,.06); border: 2px solid #7fa6ec; box-shadow: inset 0 0 6px rgba(127,166,236,.25); }
.en.on { background: radial-gradient(circle, #e0453a 0 52%, rgba(224,69,58,.35) 56%, transparent 60%); border-color: #e0453a; box-shadow: none; }
.en.sm { width: 26px; height: 26px; }
.enhint { font-size: 12px; color: var(--muted); }
.skillsel { width: 150px !important; padding: 5px 9px !important; font-size: 13px !important; border-style: dashed !important; background: transparent !important; color: var(--muted); }
.tok.energy { border-color: #4b6fb0; background: radial-gradient(circle at 35% 30%, #e3ecff 0 18%, #7fa6ec 19% 62%, #3d5f9e 63%); }
.tiny { padding: 4px 10px; font-size: 13px; color: var(--muted); }
.count { font-family: var(--mono); font-size: 13px; color: var(--gold); min-width: 2ch; }

/* aspects & skills */
.list { display: grid; gap: 7px; }
.asp { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; }
.asp .eyebrow { font-size: 10px; }
.rows { display: grid; gap: 6px; }
.rowx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.x { padding: 4px 10px; color: var(--muted); }
.add { justify-self: start; font-size: 13px; padding: 5px 12px; }
.rung { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.rung .lv { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 6px; }
.rung .lv b { color: var(--ink); font-size: 14px; margin-right: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 11px; font-size: 14px; }
.chip button { border: 0; background: transparent; padding: 0 7px; color: var(--muted); }
.skilladd { width: 120px !important; padding: 5px 9px !important; font-size: 13px !important; border-style: dashed !important; background: transparent !important; }

/* scene */
.scene-npcs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.npc { flex: none; width: 108px; scroll-snap-align: start; display: grid; gap: 6px; text-align: center; padding: 0; background: transparent; border: 0; }
.npc .art { width: 108px; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; display: grid; place-items: center; font-family: var(--display); font-size: 40px; color: #0e131b; border: 1px solid var(--line); }
.npc .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.npc span { font-size: 14px; font-weight: 500; }
.loc { display: grid; gap: 10px; }
.loc .cover { border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; background: repeating-linear-gradient(135deg, var(--panel-2) 0 10px, var(--panel) 10px 20px); display: grid; place-items: center; color: var(--muted); font-size: 13px; border: 1px solid var(--line); }
.loc h3 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; }

/* sticker */
.sticker { background: var(--note); color: var(--note-ink); border-radius: 4px 4px 14px 4px; padding: 14px 16px 16px; box-shadow: 0 10px 24px rgba(0,0,0,.35); transform: rotate(-1.2deg); position: relative; }
.sticker::before { content: ""; position: absolute; top: -8px; left: 50%; width: 64px; height: 16px; transform: translateX(-50%) rotate(2deg); background: rgba(236,217,160,.55); border-radius: 2px; }
.sticker h4 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 21px; }
.sticker .grp { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; margin: 10px 0 4px; }
.sticker ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.sticker li { font-size: 15.5px; line-height: 1.35; padding-left: 14px; position: relative; }
.sticker li::before { content: "•"; position: absolute; left: 0; }
.sticker li.closed { opacity: .55; letter-spacing: .3em; }
.sticker li.fresh { animation: reveal 1.2s ease-out; }
@keyframes reveal { 0% { background: rgba(255,93,77,.35); } 100% { background: transparent; } }

/* minimap */
.mini { position: relative; border-radius: 12px; overflow: hidden; background: #0a1420; border: 1px solid var(--line); aspect-ratio: 4 / 3; cursor: zoom-in; padding: 0; width: 100%; display: block; }
.mini svg { display: block; width: 100%; height: 100%; }
.mini .mlabel { position: absolute; left: 10px; top: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); background: rgba(10,15,23,.75); padding: 3px 7px; border-radius: 5px; }

.dice { display: flex; gap: 8px; align-items: center; }
.die { width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1; background: #ece6d6; color: #2a2a2a; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.die.p { color: #2f7d4f; } .die.m { color: #c0392b; }
.die.sm { width: 26px; height: 26px; font-size: 17px; border-radius: 6px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.die.spin { animation: dshake .12s linear infinite; }
@keyframes dshake { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }
@media (prefers-reduced-motion: reduce) { .die.spin { animation: none; } }
.rtotal { font-family: var(--display); font-size: 34px; line-height: 1; }
.rword { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rout { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid currentColor; }
.rout.fail { color: #ff8a7d; } .rout.tie { color: #e6c773; } .rout.ok { color: #7fd1a0; } .rout.style { color: #9fd0ff; }
.rlog { display: grid; gap: 6px; }
.rlog .ri { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); font-size: 13px; }
.rlog .ri .who { font-weight: 600; } .rlog .ri .det { color: var(--muted); font-size: 12px; grid-column: 1; }
.rlog .ri .tot { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); font-size: 24px; text-align: right; }
.rlog .ri .tot small { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.rskills { display: flex; flex-wrap: wrap; gap: 6px; }
.rskills button { border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.rskills button.on { background: var(--gold); color: #2a2310; border-color: var(--gold); }
.rskills button b { font-family: var(--mono); font-weight: 600; margin-left: 4px; }
.rpanel { display: grid; gap: 12px; }
.rmod { display: flex; gap: 8px; align-items: center; }
.rmod .count { min-width: 3ch; text-align: center; }
.rgo { padding: 14px; font-size: 17px; font-weight: 600; border-radius: 12px; background: var(--gold); color: #2a2310; border-color: var(--gold); }
.rres { display: grid; gap: 10px; justify-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #10161f; }
.rres .line { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.rvs { font-size: 13px; color: var(--muted); }
.dock .roll-btn { background: var(--gold); color: #2a2310; border-color: var(--gold); font-weight: 600; flex: 0 0 auto; padding: 12px 18px; }
.cfp { display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid #5a2f2f; background: #1d1316; margin-bottom: 4px; }
.cfp .h { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.cfp .h b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.cfo { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin: 0; list-style: none; padding-left: 0; }
.cfo li { flex: none; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13.5px; white-space: nowrap; }
.cfo li.cur { background: var(--gold); color: #2a2310; border-color: var(--gold); font-weight: 600; }
.cfo li.acted { opacity: .5; } .cfo li.acted::before { content: "✓ "; }
.cfo li.mob { border-color: #5a2f2f; } .cfo li.me { box-shadow: 0 0 0 1px var(--gold) inset; }
.cfo li.down { text-decoration: line-through; opacity: .4; }
.yourturn { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--gold); color: #2a2310; border-radius: 10px; padding: 8px 10px 8px 14px; font-weight: 600; animation: turnpulse 1.4s ease-out; }
@keyframes turnpulse { 0% { box-shadow: 0 0 0 0 rgba(236,217,160,.8); } 100% { box-shadow: 0 0 0 12px rgba(236,217,160,0); } }
.yourturn button { background: #2a2310; color: var(--gold); border-color: #2a2310; }
/* dock (phone) */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 10px; justify-content: space-between; padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, rgba(8,11,16,.96) 35%); }
.dock button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 500; }
.dock .note-btn { background: var(--note); color: var(--note-ink); border-color: var(--note); }
.dock .map-btn { background: #16324f; border-color: #2b5884; }
@media (min-width: 960px) { .dock { display: none; } }
.side-only { display: none; }
@media (min-width: 960px) { .side-only { display: grid; } }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(5,8,12,.94); display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 56px) max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(14px, env(safe-area-inset-left, 0px)); }
.overlay .close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(14px, env(safe-area-inset-right, 0px)); }
.artshow { display: grid; gap: 12px; justify-items: center; text-align: center; max-width: 100%; max-height: 100%; animation: pop .35s ease-out; }
.artshow .big { width: min(78vw, 440px); aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; display: grid; place-items: center; font-family: var(--display); font-size: 140px; color: #0e131b; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.artshow .big img { width: 100%; height: 100%; object-fit: cover; }
.artshow h3 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0; }
.artshow .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .artshow, .sticker li.fresh { animation: none; } }
.sheet-ov { place-items: end center; padding-bottom: 0; }
.sheet-ov .panel { width: min(100%, 520px); max-height: 82vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.map-ov .bigmap { width: min(100%, 900px); aspect-ratio: 4 / 3; max-height: 100%; border-radius: 14px; overflow: hidden; background: #0a1420; border: 1px solid var(--line); }
.map-ov .bigmap svg { width: 100%; height: 100%; display: block; }

/* demo panel */
.demo { border: 1px dashed #6d6240; border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; background: #17150f; }
.demo .row { display: flex; flex-wrap: wrap; gap: 6px; }
.demo button { font-size: 13px; padding: 6px 10px; }
.demo button.on { border-color: var(--gold); color: var(--gold); }

.sticker li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pend { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: rgba(42,35,16,.12); border: 1px dashed rgba(42,35,16,.45); border-radius: 4px; padding: 0 5px; }
.free { display: inline-flex; gap: 4px; }
.fi { width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1.5px solid var(--note-ink); background: transparent; }
.fi:hover { background: var(--note-ink); }
.propose { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 12px; }
.propose input { background: rgba(255,255,255,.55); color: var(--note-ink); border-color: rgba(42,35,16,.3); font-size: 14px; padding: 7px 9px; }
.propose input::placeholder { color: rgba(42,35,16,.55); }
.propose button { background: var(--note-ink); color: var(--note); border-color: var(--note-ink); font-size: 13px; padding: 6px 10px; }
.dlist { display: grid; gap: 6px; width: 100%; }
.drow { display: flex; flex-wrap: wrap; gap: 6px; }
.dadd { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
.dadd input[type=text] { flex: 1 1 200px; width: auto; padding: 6px 9px; font-size: 14px; }
.dadd select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; padding: 6px 8px; }
.dchk { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }

.mapseg { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(14px, env(safe-area-inset-left, 0px)); display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.mapseg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 8px 14px; font-size: 14px; }
.mapseg button + button { border-left: 1px solid var(--line); }
.mapseg button.on { background: var(--panel-2); color: var(--gold); }
@media (max-width: 600px) { .map-ov .bigmap { aspect-ratio: 3 / 4; } }

.npc.mob .art { border: 2px solid #8a3a33; position: relative; }
.hp { position: absolute; top: 6px; right: 6px; display: grid; gap: 4px; padding: 4px; background: rgba(10,6,6,.72); border-radius: 6px; }
.hp i { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid #ff8a7e; display: block; }
.hp i.on { background: var(--blood); border-color: var(--blood); box-shadow: 0 0 6px rgba(255,93,77,.8); }
.hpq { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,6,6,.72); color: #ff8a7e; font-family: var(--mono); font-size: 13px; }
.npc.mob.down .art { filter: grayscale(1) brightness(.6); }
.downx { position: absolute; inset: auto 0 10px 0; text-align: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #ffb3a9; background: rgba(10,6,6,.8); padding: 3px 0; }
.npc.mob.down .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 47%, rgba(255,93,77,.85) 48%, rgba(255,93,77,.85) 52%, transparent 53%); }
.login { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); padding: 16px; }
.lbox { width: min(360px, 100%); display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.lbox h2 { color: var(--gold); font-size: 30px; }
.lbox input { padding: 11px 12px; font-size: 16px; }
.lbox button[type=submit] { background: var(--gold); color: #2a2310; border-color: var(--gold); font-weight: 600; padding: 12px; }
.lbox .msg { font-size: 13.5px; color: var(--muted); }
.waitbox { display: grid; gap: 8px; text-align: center; padding: 30px 10px; color: var(--muted); }
.waitbox b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--ink); }

    const n = [...sc.aspects, ...sc.locAspects].filter(a => a.open).length;
    $('openSticker').textContent = 'Аспекты сцены · ' + n;
    renderSticker($('stickerSide')); if (!$('stickerOv').hidden) renderSticker($('stickerBody'));
    renderMini($('miniSide'), false);
    if (!$('mapOv').hidden) setMapMode(mapMode);
    renderRoll();
  }
  const myPending = [];
  function renderSticker(host) {
    host.textContent = ''; const sc = S.scene;
    const st = mk('div', 'sticker', host); mk('h4', '', st, 'Аспекты сцены');
    if (!sc) { mk('div', 'grp', st, 'Сцены пока нет'); return; }
    const group = (title, arr, isLoc) => {
      mk('div', 'grp', st, title); const ul = mk('ul', '', st);
      if (!arr.length) mk('li', 'closed', ul, '—');
      arr.forEach(a => {
        const li = mk('li', a.open ? (fresh.has(a.id) ? 'fresh' : '') : 'closed', ul);
        if (!a.open) { li.textContent = '???'; li.setAttribute('aria-label', 'Скрытый аспект'); return; }
        mk('span', '', li, a.t); if (a.pending) mk('span', 'pend', li, 'на одобрении');
        if (a.free > 0 && !a.pending) { const fw = mk('span', 'free', li); for (let i = 0; i < a.free; i++) { const f = mk('button', 'fi', fw); f.type = 'button'; f.title = 'Использовать бесплатный призыв'; f.setAttribute('aria-label', 'Использовать бесплатный призыв: ' + a.t); f.addEventListener('click', () => { f.disabled = true; db.collection('proposals').add({ kind: 'free', aid: isLoc ? null : a.id, text: isLoc ? a.t : null, byName: (pc && pc.name) || '', uid: me.uid, t: Date.now() }).catch(netBad); }); } }
      });
    };
    group('Сцена', sc.aspects.concat(myPending.filter(p => !sc.aspects.some(a => a.t === p.t)).map(p => ({ id: p.id, t: p.t, open: true, pending: true }))), false);
    if (sc.loc) group(sc.loc.name, sc.locAspects, true);
    const mc = []; sc.mobs.forEach(m => { const lab = { mild: 'лёгкое', moderate: 'среднее', severe: 'тяжёлое' }; Object.keys(m.cons || {}).forEach(k => mc.push({ id: m.id + k, t: m.cons[k] + ' (' + m.name + ', ' + lab[k] + ')', open: true })); });
    if (mc.length) group('Раны противников', mc, false);
    const add = mk('form', 'propose', st);
    const inp = mk('input', '', add); inp.type = 'text'; inp.id = 'propose-' + (host.id || 'x'); inp.placeholder = 'Создал преимущество? Впиши аспект'; inp.setAttribute('aria-label', 'Предложить аспект сцены');
    const b = mk('button', '', add, 'Предложить'); b.type = 'submit';
    add.addEventListener('submit', async e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; inp.value = ''; const p = { id: nid(), t: v }; myPending.push(p); renderScene(); try { await db.collection('proposals').doc(p.id).set({ t: v, byName: (pc && pc.name) || '', uid: me.uid, ts: Date.now() }); } catch (err) { netBad(err); } });
  }

  // ---------- map ----------
  const NS = 'http://www.w3.org/2000/svg', el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  function bbox(d) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; (d.match(/-?[\d.]+,-?[\d.]+/g) || []).forEach(p => { const [x, y] = p.split(',').map(Number); if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }); return [x0, y0, x1 - x0, y1 - y0]; }
  function renderMini(host, big) {
    host.textContent = ''; const sc = S.scene, zid = sc && sc.zone, z = zid && G.zones[zid];
    const wrap = big ? host : mk('button', 'mini', host);
    if (!big) { wrap.type = 'button'; wrap.setAttribute('aria-label', 'Открыть карту'); wrap.addEventListener('click', openMap); }
    const night = sc && sc.night, dim = night ? .7 : 1;
    const svg = el('svg', { viewBox: '0 0 1000 1172', preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': 'Карта' }, wrap);
    el('rect', { x: -2000, y: -2000, width: 6000, height: 6000, fill: '#0a1420' }, svg);
    G.city.forEach(c => el('path', { d: c.d, fill: z && c.k === z.d ? '#5a4552' : '#1d2533', 'fill-opacity': dim, stroke: '#0a0f17', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke' }, svg));
    if (z && G.blocks[z.d]) el('path', { d: G.blocks[z.d], fill: '#e7e2d3', 'fill-opacity': .12 }, svg);
    G.canals.forEach(d => el('path', { d, fill: night ? '#3f7fbf' : '#2b5884' }, svg));
    G.water.forEach(d => el('path', { d, fill: 'none', stroke: night ? '#3f7fbf' : '#2b5884', 'stroke-width': 3, 'vector-effect': 'non-scaling-stroke', 'stroke-linecap': 'round' }, svg));
    let vb = [60, 120, 880, 860];
    if (z) { el('path', { d: z.p, fill: '#ecd9a0', 'fill-opacity': .1, stroke: '#ecd9a0', 'stroke-width': 2, 'stroke-dasharray': '6 4', 'vector-effect': 'non-scaling-stroke' }, svg); const b = bbox(z.p), pad = Math.max(b[2], b[3]) * .25; vb = [b[0] - pad, b[1] - pad, b[2] + pad * 2, b[3] + pad * 2]; }
    svg.setAttribute('viewBox', vb.join(' '));
    const u = vb[2] / (big ? 900 : 320);
    (sc && sc.locs || []).forEach(l => { el('rect', { x: l.x - 8 * u, y: l.y - 8 * u, width: 16 * u, height: 16 * u, rx: 3 * u, fill: '#141b26', stroke: l.c, 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke' }, svg); const t = el('text', { x: l.x + 12 * u, y: l.y + 4 * u, 'font-size': 12 * u, fill: '#e7e2d3', 'font-family': 'JetBrains Mono, monospace', 'paint-order': 'stroke', stroke: '#0a0f17', 'stroke-width': 3 * u }, svg); t.textContent = l.n; });
    if (sc && sc.party) { const { x: px, y: py } = sc.party; el('path', { d: `M${px},${py} l${-10 * u},${-22 * u} a${12 * u},${12 * u} 0 1,1 ${20 * u},0 z`, fill: '#e7e2d3', stroke: '#0a0f17', 'stroke-width': 2 * u }, svg); el('circle', { cx: px, cy: py - 26 * u, r: 4.5 * u, fill: '#0a0f17' }, svg); }
    if (!big) mk('span', 'mlabel', wrap, (z && ((sc.zoneNames || {})[zid] || z.n)) || 'Город');
  }
  function renderCity(host) {
    host.textContent = ''; const sc = S.scene, z = sc && sc.zone && G.zones[sc.zone], night = sc && sc.night;
    const svg = el('svg', { viewBox: '40 -60 900 1060', preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': 'Карта города' }, host);
    el('rect', { x: -2000, y: -2000, width: 6000, height: 6000, fill: '#0a1420' }, svg);
    G.city.forEach(c => el('path', { d: c.d, fill: z && c.k === z.d ? '#5a4552' : '#1d2533', stroke: '#0a0f17', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke', 'fill-opacity': night ? .75 : 1 }, svg));
    G.water.forEach(d => el('path', { d, fill: 'none', stroke: night ? '#3f7fbf' : '#2b5884', 'stroke-width': 6, 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' }, svg));
    if (z) el('path', { d: z.p, fill: '#ecd9a0', 'fill-opacity': .25, stroke: '#ecd9a0', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke' }, svg);
    G.city.forEach(c => { const here = z && c.k === z.d; const t = el('text', { x: c.l[0], y: c.l[1], 'text-anchor': 'middle', 'font-family': 'Oranienbaum, serif', 'font-size': here ? 26 : 20, fill: here ? '#ecd9a0' : '#aab2c0', 'paint-order': 'stroke', stroke: '#0a0f17', 'stroke-width': 4 }, svg); t.textContent = c.n; });
    if (sc && sc.party) { const { x: px, y: py } = sc.party; el('path', { d: `M${px},${py} l-9,-20 a11,11 0 1,1 18,0 z`, fill: '#e7e2d3', stroke: '#0a0f17', 'stroke-width': 2 }, svg); el('circle', { cx: px, cy: py - 24, r: 4, fill: '#0a0f17' }, svg); }
  }

  // ---------- overlays ----------
  function openOv(id) { $(id).hidden = false; const c = $(id).querySelector('[data-close]'); if (c) c.focus(); }
  document.querySelectorAll('.overlay').forEach(ov => { ov.addEventListener('click', e => { if (e.target === ov || e.target.hasAttribute('data-close')) ov.hidden = true; }); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach(o => o.hidden = true); });
  let mapMode = 'zone';
  function setMapMode(m) { mapMode = m; $('segZone').classList.toggle('on', m === 'zone'); $('segCity').classList.toggle('on', m === 'city'); $('segZone').setAttribute('aria-pressed', m === 'zone'); $('segCity').setAttribute('aria-pressed', m === 'city'); if (m === 'zone') renderMini($('mapBody'), true); else renderCity($('mapBody')); }
  function openMap() { openOv('mapOv'); setMapMode('zone'); }
  $('segZone').addEventListener('click', () => setMapMode('zone'));
  $('segCity').addEventListener('click', () => setMapMode('city'));
  $('openMap').addEventListener('click', openMap);
  $('openSticker').addEventListener('click', () => { renderSticker($('stickerBody')); openOv('stickerOv'); });

  // ---------- dice ----------
  const RS = { skill: null, bonus: 0, mod: 0, last: null, anim: false };
  function rollBox() { return matchMedia('(min-width: 960px)').matches ? $('rollSide') : $('rollBody'); }
  function pushRoll(r) { if (!me) return; db.collection('rolls').doc(r.id).set(Object.assign({}, r, { uid: me.uid })).catch(netBad); }
  function renderRoll() {
    const box = rollBox(); if (!box) return; if (box === $('rollBody') && $('rollOv').hidden) return; box.textContent = '';
    const w = mk('div', 'rpanel', box); mk('h2', '', w, 'Бросок 4dF');
    const dc = S.scene && S.scene.dc; if (dc != null) mk('div', 'rvs', w, 'Мастер назначил сложность: ' + lword(dc) + ' (' + sgn(dc) + ')');
    mk('div', 'eyebrow', w, 'Навык');
    const rs = mk('div', 'rskills', w);
    const opt = (label, skill, bonus) => { const on = RS.skill === skill; const b = mk('button', on ? 'on' : '', rs); b.type = 'button'; b.setAttribute('aria-pressed', on); b.append(label); mk('b', '', b, sgn(bonus)); b.addEventListener('click', () => { RS.skill = skill; RS.bonus = bonus; renderRoll(); }); };
    if (pc) LADDER.forEach(([n]) => (pc.skills[n] || []).forEach(s => opt(s, s, +n)));
    opt('Без навыка', null, 0);
    const mr = mk('div', 'rmod', w); mk('span', 'eyebrow', mr, 'Модификатор');
    const mm = mk('button', 'tiny', mr, '−'); mm.type = 'button'; mm.setAttribute('aria-label', 'Модификатор минус'); mm.addEventListener('click', () => { RS.mod--; renderRoll(); });
    mk('span', 'count', mr, sgn(RS.mod));
    const mp = mk('button', 'tiny', mr, '+'); mp.type = 'button'; mp.setAttribute('aria-label', 'Модификатор плюс'); mp.addEventListener('click', () => { RS.mod++; renderRoll(); });
    const go = mk('button', 'rgo', w, 'Бросить' + (RS.skill ? ': ' + RS.skill + ' ' + sgn(RS.bonus) : '')); go.type = 'button';
    go.addEventListener('click', () => { const r = { id: nid(), who: (pc && pc.name) || 'Игрок', skill: RS.skill, bonus: RS.bonus, mod: RS.mod, dice: roll4dF(), inv: 0, dc: dc == null ? null : dc, t: Date.now() }; S.rolls.unshift(r); RS.last = r; RS.mod = 0; RS.anim = true; pushRoll(r); renderRoll(); });
    const last = RS.last && (S.rolls.find(r => r.id === RS.last.id) || RS.last);
    if (last) {
      const res = mk('div', 'rres', w); res.setAttribute('aria-live', 'polite');
      const line = mk('div', 'line', res); const dw = diceEl(last.dice, line);
      const tw = mk('div', '', line); mk('div', 'rtotal', tw, sgn(rTotal(last))); mk('div', 'rword', tw, lword(rTotal(last)));
      const o = rOutcome(last); if (o) mk('span', 'rout ' + o[0], line, o[1]);
      mk('div', 'rvs', res, rDetail(last));
      if (RS.anim) { RS.anim = false; const real = last.dice.slice(); tw.style.visibility = 'hidden'; animDice(dw, () => { const nd = diceEl(real, null); dw.replaceWith(nd); tw.style.visibility = ''; }); }
      const ar = mk('div', 'line', res);
      const inv = mk('button', 'tiny', ar, '+2 за призыв аспекта (−1 жетон)'); inv.type = 'button'; inv.disabled = !pc || pc.fp <= 0;
      inv.addEventListener('click', () => { if (!pc || pc.fp <= 0) return; pc.fp--; last.inv = (+last.inv || 0) + 1; RS.last = last; pushRoll(last); save(); renderPC(); renderRoll(); });
      const re = mk('button', 'tiny', ar, 'Переброс (−1 жетон)'); re.type = 'button'; re.disabled = !pc || pc.fp <= 0;
      re.addEventListener('click', () => { if (!pc || pc.fp <= 0) return; pc.fp--; last.dice = roll4dF(); last.re = true; RS.last = last; RS.anim = true; pushRoll(last); save(); renderPC(); renderRoll(); });
      const fr = mk('button', 'tiny', ar, '+2 бесплатный призыв'); fr.type = 'button'; fr.addEventListener('click', () => { last.inv = (+last.inv || 0) + 1; RS.last = last; pushRoll(last); renderRoll(); });
    }
    if (S.rolls.length) { mk('div', 'eyebrow', w, 'Броски за столом'); const lg = mk('div', 'rlog', w); S.rolls.slice(0, 8).forEach(r => rlogItem(r, lg)); }
  }
  $('openRoll').addEventListener('click', () => { openOv('rollOv'); renderRoll(); });
  matchMedia('(min-width: 960px)').addEventListener('change', () => renderRoll());
  showWait('Загрузка…', ''); renderScene();
})();
</script>

</html>
